[project]
name = "notepm-mcp-server"
version = "0.1.0"
description = "A NotePM MCP server implementation."
readme = "README.md"
authors = [{ name = "Keita Ibaraki", email = "ibaraki@ncdc.co.jp" }]
license = "MIT"
requires-python = ">=3.10"
# 上限を明示すること。上限が無いと、uv.lock を参照しないインストール経路
# (uvx / pip install git+... など) で起動時に破壊的変更を含む最新版を取得してしまう。
# 例: mcp 2.0.0 は低レベルサーバのハンドラ登録方式を全面的に差し替えた。
# 更新時は上限を外さず、レンジごと引き上げること。
dependencies = [
    "click>=8.1.0,<9",
    "httpx2>=2.12.0,<3",
    "mcp>=2.2.0,<3",
    "pydantic>=2.12.0,<3",
    "python-dotenv>=1.1.0,<2",
]

[dependency-groups]
dev = [
    "ty>=0.0.79,<0.1",
]

[project.scripts]
notepm-mcp-server = "notepm_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ty はまだ 0.0.x のプレビュー段階のため、全ルールを error として運用する。
# 新しい版で規則が追加されると指摘が増え得るので、上限を固定したうえで更新時に確認すること。
[tool.ty.rules]
all = "error"
